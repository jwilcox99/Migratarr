# Packaging for `pip install migratarr` (plan phases 6-7). An installed copy keeps its
# settings, runs and logs in one data folder: $MIGRATARR_HOME, default
# ~/.local/share/migratarr (migratarr/paths.py). A clone (`pip install -e .`) keeps using
# the clone. The version comes from migratarr_cli.__version__; releases: release.yml.
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "migratarr"
dynamic = ["version"]
description = "Moves Radarr/Sonarr media between storage tiers by how hard it is to re-acquire, where it streams and how it is watched; every move is approved first."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = []  # standard library only
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: POSIX :: Linux",
    "Environment :: Web Environment",
    "Topic :: Multimedia :: Video",
]

[project.scripts]
migratarr = "migratarr_cli:main"

[project.urls]
Source = "https://github.com/jwilcox99/Migratarr"
Issues = "https://github.com/jwilcox99/Migratarr/issues"

[tool.setuptools]
packages = ["migratarr", "migratarr.engine", "migratarr.settings", "migratarr_validation"]
py-modules = [
    "approval_store",
    "approve_execution",
    "arr_files",
    "audit_overrides",
    "batch_cross_movies",
    "batch_cross_tv",
    "build_execution_manifest",
    "build_move_plan",
    "dry_run_movies",
    "dry_run_tv",
    "execute_cross_movie",
    "execute_cross_tv",
    "execute_movie",
    "execute_movie_nas",
    "execute_tv_nas",
    "executor_command",
    "executor_inventory",
    "executor_manifest",
    "executor_nfs",
    "media_layout",
    "migratarr_cli",
    "migratarr_doctor",
    "migratarr_jobs",
    "migratarr_plan",
    "migratarr_reconcile",
    "migratarr_status",
    "migratarr_ui",
    "movie_placement_v1",
    "pipeline_inputs",
    "planner_settings",
    "read_api",
    "reconcile_store",
    "recover_cross_0102",
    "recover_cross_0116",
    "recover_cross_published",
    "runtime_config",
    "service_keys",
    "settings_contract",
    "settings_ui",
    "setup_wizard",
    "snapshot_run",
    "storage_targets",
    "tv_placement_v1",
]

[tool.setuptools.dynamic]
version = {attr = "migratarr_cli.__version__"}
