# Packaging for `pip install migratarr` (plan phases 6-7). An installed copy keeps its
# settings, runs and logs in one data folder: $MIGRATARR_HOME, default
# ~/.local/share/migratarr (migratarr/paths.py). A clone (`pip install -e .`) keeps using
# the clone. The version comes from migratarr.cli.__version__; releases: release.yml.
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "migratarr"
dynamic = ["version"]
description = "Moves Radarr/Sonarr media between storage tiers by how hard it is to re-acquire, where it streams and how it is watched; every move is approved first."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = []  # standard library only
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: POSIX :: Linux",
    "Environment :: Web Environment",
    "Topic :: Multimedia :: Video",
]

[project.scripts]
migratarr = "migratarr.cli:main"

[project.urls]
Source = "https://github.com/jwilcox99/Migratarr"
Issues = "https://github.com/jwilcox99/Migratarr/issues"

[tool.setuptools]
# Only the package is installed. The top-level *.py files in a clone are compatibility
# wrappers (python3 <script>.py keeps working there); migratarr_validation and tests/ are
# development tools.
packages = ["migratarr", "migratarr.engine", "migratarr.settings"]

[tool.setuptools.dynamic]
version = {attr = "migratarr.cli.__version__"}
