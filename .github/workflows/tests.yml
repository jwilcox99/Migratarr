name: Safe unit tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the documented minimum (README); newer versions catch
        # stdlib deprecations/removals before users on current distros hit them.
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
