name: Release
# Tag vX.Y.Z on main to publish: checks the tag matches the version in migratarr/cli.py,
# runs the tests, builds, publishes to PyPI (trusted publishing: no token stored here)
# and creates the GitHub release from that version's CHANGELOG section.
# A pre-release tag (v0.1.0rc1, v0.1.0b2, ...) uses the CHANGELOG section of the version
# it leads to ([0.1.0]) and is marked as a pre-release; pip installs it only when asked
# (pip install --pre migratarr, or migratarr==0.1.0rc1).
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tag matches the package version
        run: |
          version=$(python -c 'import migratarr.cli; print(migratarr.cli.__version__)')
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != version $version"; exit 1; }
      - run: python -m unittest discover -s tests
      - run: |
          python -m pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Release notes from CHANGELOG.md
        run: |
          version=${GITHUB_REF_NAME#v}
          base=$(echo "$version" | sed -E 's/(a|b|rc)[0-9]+$//')
          prerelease=""
          if [ "$base" != "$version" ]; then prerelease="--prerelease"; fi
          awk -v v="$base" 'index($0, "## [" v "]") == 1 {on=1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "No CHANGELOG section for [$base]"; exit 1; }
          gh release create "$GITHUB_REF_NAME" dist/* --title "Migratarr $version" --notes-file notes.md $prerelease
        env:
          GH_TOKEN: ${{ github.token }}
