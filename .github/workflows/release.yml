name: Release
# Tag vX.Y.Z on main to publish: checks the tag matches the version in migratarr/cli.py,
# runs the tests, builds, publishes to PyPI (trusted publishing: no token stored here)
# and creates the GitHub release from that version's CHANGELOG section.
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tag matches the package version
        run: |
          version=$(python -c 'import migratarr.cli; print(migratarr.cli.__version__)')
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != version $version"; exit 1; }
      - run: python -m unittest discover -s tests
      - run: |
          python -m pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Release notes from CHANGELOG.md
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "No CHANGELOG section for [$version]"; exit 1; }
          gh release create "$GITHUB_REF_NAME" dist/* --title "Migratarr $version" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
